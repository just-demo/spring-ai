spring.application.name=spring-ai
spring.main.web-application-type=none

spring.config.import=optional:file:.env[.properties]
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-nano
# text-embedding-3-small produces much better results than the OpenAI default embedding model
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.mcp.server.enabled=false

# lettuce-core is also on the classpath (pulled in by spring-boot-data-redis) and would otherwise
# win over jedis as the default Redis client; spring-ai's Redis vector store needs a JedisConnectionFactory
spring.data.redis.client-type=jedis